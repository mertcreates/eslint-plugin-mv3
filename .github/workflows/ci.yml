name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Lint
        run: npm run lint

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node-version: '20.19.0', eslint-version: '8.50.0' }
          - { node-version: '20.19.0', eslint-version: '8' }
          - { node-version: '20.19.0', eslint-version: '9' }
          - { node-version: '20.19.0', eslint-version: '10.0.0' }
          - { node-version: '20.19.0', eslint-version: '10' }
          - { node-version: '22.13.0', eslint-version: '10' }
          - { node-version: '24', eslint-version: '10' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v1
      - name: Install selected ESLint
        run: npm install --no-save --package-lock=false --ignore-scripts eslint@${{ matrix.eslint-version }}
      - name: Test
        if: matrix.node-version == '20.19.0'
        run: bun test
      - name: Node recommended config smoke
        if: startsWith(matrix.eslint-version, '10')
        run: npm run test:smoke
